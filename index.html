<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ── Header ──────────────────────────────────────── -->
  <header class="header">
    <div class="header-logo">
      <img id="store-logo" alt="Logo" style="display:none">
      <span id="store-name">Catálogo</span>
    </div>

    <div class="header-search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search-input" type="search" placeholder="Buscar productos…" autocomplete="off">
    </div>

    <div class="header-actions">
      <a href="admin.html" class="btn-admin-link">⚙ Admin</a>
      <button class="btn-cart" onclick="Cart.toggle()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Carrito
        <span id="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- ── Banner ──────────────────────────────────────── -->
  <div class="banner">
    <span id="banner-text">Bienvenido a nuestra tienda</span>
  </div>

  <!-- ── Category bar ────────────────────────────────── -->
  <div class="category-bar-wrapper">
    <div class="category-bar" id="category-bar">
      <button class="cat-pill active" onclick="filterCategory('all')">Todos</button>
    </div>
  </div>

  <!-- ── Main content ────────────────────────────────── -->
  <main class="main-content">
    <div id="products-grid"></div>
    <div id="products-empty">
      <span class="empty-icon">🔍</span>
      <p>No se encontraron productos</p>
    </div>
  </main>

  <footer>
    <p>© <span id="footer-year"></span> — Todos los derechos reservados</p>
  </footer>

  <!-- ── Cart overlay ────────────────────────────────── -->
  <div class="overlay" id="cart-overlay"></div>

  <!-- ── Cart sidebar ────────────────────────────────── -->
  <aside id="cart-sidebar">
    <div class="cart-header">
      <h2>🛒 Tu carrito</h2>
      <button class="cart-close" onclick="Cart.close()">✕</button>
    </div>

    <div id="cart-empty" style="display:flex">
      <span class="empty-cart-icon">🛍️</span>
      <p>Tu carrito está vacío</p>
    </div>

    <div id="cart-items-list"></div>

    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Total</span>
        <span id="cart-total">$ 0,00</span>
      </div>
      <button id="cart-checkout-btn" class="btn-checkout" onclick="Cart.checkout()" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Pedir por WhatsApp
      </button>
      <button class="btn-clear-cart" onclick="Cart.clear()">Vaciar carrito</button>
    </div>
  </aside>

  <!-- ── Modal overlay ───────────────────────────────── -->
  <div id="modal-overlay"></div>

  <!-- ── Product modal ───────────────────────────────── -->
  <div id="product-modal" role="dialog" aria-modal="true">
    <div class="modal-carousel-wrap">
      <div id="modal-carousel"></div>
      <button id="carousel-prev" class="carousel-nav" onclick="goToSlide(modalCarouselIndex - 1)">‹</button>
      <button id="carousel-next" class="carousel-nav" onclick="goToSlide(modalCarouselIndex + 1)">›</button>
      <div id="carousel-dots"></div>
    </div>

    <div class="modal-info">
      <button class="modal-close" onclick="closeProductModal()">✕</button>
      <span id="modal-category"></span>
      <h2 id="modal-name"></h2>
      <p id="modal-price"></p>
      <span id="modal-stock" class="modal-stock"></span>
      <p id="modal-desc"></p>

      <div class="modal-qty-section">
        <label>Cantidad</label>
        <div class="qty-input-wrap">
          <button onclick="changeModalQty(-1)">−</button>
          <input id="modal-qty" type="number" value="1" min="1">
          <button onclick="changeModalQty(1)">+</button>
        </div>
        <div id="modal-steps"></div>
      </div>

      <button id="modal-add-btn" class="btn-modal-add" onclick="modalAddToCart()">
        Agregar al carrito
      </button>
    </div>
  </div>

  <!-- ── Checkout modal ──────────────────────────────────── -->
  <div id="checkout-overlay" class="overlay"></div>

  <div id="checkout-modal" role="dialog" aria-modal="true">
    <div class="checkout-header">
      <button class="checkout-back" onclick="closeCheckout()">← Volver al carrito</button>
      <h2>Completar pedido</h2>
    </div>

    <div class="checkout-body">

      <!-- Resumen rápido -->
      <div class="checkout-summary" id="checkout-summary"></div>

      <!-- Datos personales -->
      <section class="checkout-section">
        <h3>👤 Datos personales</h3>
        <div class="checkout-grid">
          <div class="co-field">
            <label>Nombre completo *</label>
            <input id="co-nombre" type="text" placeholder="Ej: Juan Pérez">
          </div>
          <div class="co-field">
            <label>DNI *</label>
            <input id="co-dni" type="text" placeholder="Ej: 30.123.456" inputmode="numeric">
          </div>
          <div class="co-field full">
            <label>Teléfono</label>
            <input id="co-telefono" type="tel" placeholder="Ej: 11 4444-5555">
          </div>
        </div>
      </section>

      <!-- Tipo de entrega -->
      <section class="checkout-section">
        <h3>🚚 Entrega</h3>
        <div class="radio-group" id="entrega-group">
          <label class="radio-card">
            <input type="radio" name="entrega" value="domicilio" onchange="onEntregaChange()">
            <span class="radio-label">
              <span class="radio-icon">🏠</span>
              <span>Envío a domicilio</span>
            </span>
          </label>
          <label class="radio-card">
            <input type="radio" name="entrega" value="sucursal" onchange="onEntregaChange()">
            <span class="radio-label">
              <span class="radio-icon">🏪</span>
              <span>Retiro por sucursal</span>
            </span>
          </label>
          <label class="radio-card">
            <input type="radio" name="entrega" value="punto" onchange="onEntregaChange()">
            <span class="radio-label">
              <span class="radio-icon">📍</span>
              <span>Retiro en punto de entrega</span>
            </span>
          </label>
        </div>

        <div id="co-direccion-wrap" class="co-field full" style="display:none;margin-top:.75rem">
          <label>Dirección completa *</label>
          <input id="co-direccion" type="text" placeholder="Calle, número, piso/depto, localidad, provincia">
        </div>
      </section>

      <!-- Forma de pago -->
      <section class="checkout-section">
        <h3>💳 Forma de pago</h3>
        <div class="radio-group">
          <label class="radio-card">
            <input type="radio" name="pago" value="Efectivo">
            <span class="radio-label"><span class="radio-icon">💵</span><span>Efectivo</span></span>
          </label>
          <label class="radio-card">
            <input type="radio" name="pago" value="Transferencia">
            <span class="radio-label"><span class="radio-icon">🏦</span><span>Transferencia</span></span>
          </label>
          <label class="radio-card">
            <input type="radio" name="pago" value="Tarjeta débito">
            <span class="radio-label"><span class="radio-icon">💳</span><span>Tarjeta débito</span></span>
          </label>
          <label class="radio-card">
            <input type="radio" name="pago" value="Tarjeta crédito">
            <span class="radio-label"><span class="radio-icon">💎</span><span>Tarjeta crédito</span></span>
          </label>
        </div>
      </section>

      <!-- Nota adicional -->
      <section class="checkout-section">
        <h3>📝 Nota adicional <span style="font-weight:400;font-size:.85rem;color:var(--color-text-2)">(opcional)</span></h3>
        <textarea id="co-nota" rows="3" placeholder="Aclaraciones sobre el pedido, horario de entrega, etc."></textarea>
      </section>

    </div><!-- /checkout-body -->

    <div class="checkout-footer">
      <div class="checkout-total-row">
        <span>Total del pedido</span>
        <span id="checkout-total-display"></span>
      </div>
      <button class="btn-whatsapp-final" onclick="Cart.submitCheckout()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Enviar pedido por WhatsApp
      </button>
    </div>
  </div>

  <!-- ── Notification ─────────────────────────────────── -->
  <div id="cart-notification"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
